# dsh-trader — 一行挂载全部运行部件（plan.md §9.2 / decision.md §11.3）
#
# 语义要点（decision.md §2.1，务必遵守）：
#   · 新增插件必须写成 `- insert: [...]`；只写 id + name 只在 id 已存在时按 id 覆盖
#   · `config` 是整行替换，不是深合并
#   · 命不中任何行的 patch 只告警；空的 cordis.patch.yml 会导致启动失败
#   · 重复 entry id 是致命错误
#
# 包安装进 profile 后，`dsh-trader/plugins/*` 由 package.json 的 exports 解析。

- insert:
    - id: trade-db
      name: dsh-trader/plugins/db
      config:
        path: !!js dshHomePath('trading/desk.db')

    - id: trade-market
      name: dsh-trader/plugins/market
      config:
        venue: htx
        crossCheckVenue: okx
        # 高流动性 + 小额合约（实测 1 张名义：ADA≈1.95 USDT、DOGE≈8.0 USDT），
        # 24.9 USDT 在 1× 下可下单；BTC≈76.4/ETH≈24.2 开不了最小张。
        symbols: [ADA/USDT:USDT, DOGE/USDT:USDT]
        timeframes: [1h]
        enabled: true          # 起轮询；--dump-config 不会启动轮询
        pollMs: 60000
        recentLimit: 3

    - id: trade-rules
      name: dsh-trader/plugins/rules
      config:
        # 只列**已实现**的规则包；写错包名会让插件启动即报错（不静默跳过）
        rulePacks: [mean_reversion_v1, breakout_v1]
        cooldownMs: 900000
        # W1 审议窗由 trade-supervisor 调度，rules 里不再重复配置（审计 S7：空读字段会误导）。
        escape: { maxPerHour: 2, maxPerDay: 6 }
        # judgment 只消费数值上限；provider/model 属于 W2/W3 唤醒路由，目前未接线 ——
        # 配了会被 config-guard **拒绝启动**，而不是静默忽略（审计 S7）。
        judgment: { maxPerHour: 3, maxPerDay: 8 }

    - id: trade-exec
      name: dsh-trader/plugins/exec
      config:
        # 开发/测试默认：paper（红线「默认 paper」）。用户已授权过最小仓位 live_auto 并完成首轮观测
        # （plan §12.2 E/F、docs/live-cycle-2026-09-16.md）；重新 arm 只需把下面一行改成 live_auto。
        mode: paper
        # ── 风险限额：由**实测权益 24.914 USDT** 推导，不写死"安全数"（plan §6.5 / §12 #17）──
        # 单笔风险 0.2% → 0.05 USDT；BTC 1h 2×ATR 止损约 0.5% → 名义 ≈10 USDT。
        # 自洽校验：maxNotionalAtMinStop = 24.914 × 0.002 ÷ 0.005 ≈ 9.97 ≤ perOrderCapUsd=12 ✓
        # ★ 注意交易所最小下单量（实测）：BTC 永续 1 张 ≈76.4 USDT、ETH ≈24.2、DOGE ≈8.2 ——
        #   24.9 USDT 在 1× 下几乎只能碰 DOGE；换标的/入金属于需要人决定的阻塞项（§12.2 A）。
        riskPct: 0.002
        perOrderCapUsd: 12
        maxExposureUsd: 24
        maxLeverage: 1
        dailyLossLimitUsd: 1.25
        maxDrawdownUsd: 2.5
        maxConsecutiveLosses: 3
        maxSpreadBps: 10
        maxOpenOrders: 2
        symbols: [ADA/USDT:USDT, DOGE/USDT:USDT]
        timeframes: [1h]
        benchmark: BTC/USDT:USDT
        venue: htx
        # 组合根：lazy 启动 broker + ports + 启动/周期对账；paper 模式**不触网**
        reconcileEnabled: true
        reconcileMs: 300000
        settleMs: 60000          # 结算扫描（plan §5.3）：独立任务扫 reflection_due_at 到期决策
        liveAckOrphans: false     # 第①步语义：只报告不撤单
        paperInitialEquityQuote: 24.914
        paperSlippageBps: 5
        paperFeeBps: 5
        # 密钥只从环境注入，绝不写进仓库/prompt；systemd 用 EnvironmentFile=%h/.dsh/trading.env (0600)
        # 交互式运行：把这两行变量写进 $DSH_HOME/.env（chmod 600），DSH 启动时自动加载
        apiKey: !!js process.env.TRADER_API_KEY
        apiSecret: !!js process.env.TRADER_API_SECRET
        # 第①步只读预检（plan §12.2 A）：默认关闭 ⇒ 完全不触网。
        # 打开后只读账户/持仓/挂单并与本地库对账，**只报告不执行**；mode 保持 paper 时硬闸结构性拒绝下单。
        preflightEnabled: false
        preflightVenue: htx
        preflightSymbol: ADA/USDT:USDT
        sandbox: false          # OKX 交叉校验/sandbox 时才置 true；HTX 无 sandbox 端点
        accountType: swap       # ★ HTX 现货与 USDT 永续账户分离；跑永续必须读 swap 账户
        positionSide: both      # ★ HTX 算法保护单必需（单向持仓模式 both）

    - id: trade-supervisor
      name: dsh-trader/plugins/supervisor
      config:
        deskSessionId: trade-desk
        l3: { provider: deepseek-official, model: deepseek-flash }
        # ★ W2/W3 判断通道当前**未接线**（P1.5 判定：关闭；decideWake 与 TriggerQueue.claim
        #   在生产路径没有调用方）。因此这里不配置 l2 / l3MinIntervalMs / dailyBudgetUsd ——
        #   配了会被 config-guard 拒绝启动（审计 S7），避免"配了却不生效"的假象。
        # W1 审议窗（plan §2）：00:30Z、每 4h、23:30Z。`at` 为 UTC 时刻，`everyMs` 为间隔。
        windows:
          - { id: pre_session, at: '00:30Z' }
          - { id: midday, everyMs: 14400000 }
          - { id: post_session, at: '23:30Z' }
        windowScanMs: 60000
        wakeTimeoutMs: 300000
        deskCwd: /workspace
        heartbeatMs: 15000

    # 预测市场事件源（plan §4.4）：**只读、永不交易**；默认关闭，打开才会打网络
    - id: trade-predictions
      name: dsh-trader/plugins/predictions
      config:
        enabled: false
        pollMs: 60000
        liquidityFloorQuote: 1000       # 薄市场不产生 novelty（低于此值一律不发）
        spreadCeilBps: 300              # 点差超上限 ⇒ 只发 info + 置信度折扣
        historyInterval: 1d             # 实测可用；1h 返回 0 行、max 超时（§4.4）
        marketPageSize: 50
        newMarketEventWhitelist: []     # 空数组 = 不产生 pm_new_market（宁可不发也不乱发）
        probJumpAbs: 0.08
        probJumpVolMultiple: 4
        probJumpCooldownMs: 900000      # 官方下限 15min，配置自检会强制
        volumeSpikeMultiple: 5
        signalTtlMs: 3600000

    - id: trade-tools-desk
      name: dsh-trader/plugins/tools-desk

    - id: trade-tools-research
      name: dsh-trader/plugins/tools-research

    - id: trade-tools-risk
      name: dsh-trader/plugins/tools-risk

    - id: trade-commands
      name: dsh-trader/plugins/commands

    # 最小闭环探针（T0.9）：默认关闭，只在专门的 probe profile 里打开
    - id: trade-probe
      name: dsh-trader/plugins/probe
      config:
        enabled: false
        sessionId: trade-probe-session
        resultPath: !!js dshHomePath('trading/probe-result.json')
